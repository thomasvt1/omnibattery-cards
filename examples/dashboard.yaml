# Add cards individually in the visual editor, or use this as a dashboard view.
# Use each card's editor to select your installation and battery devices.
# Entity overrides and price sources are optional; replace placeholders before use.
title: Energy
views:
  - title: Omnibattery
    path: omnibattery
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:omnibattery-plan-card
            title: Energy plan
            show_extension: true
            grid_options:
              columns: full
              rows: auto
            # import_price_entity: sensor.your_import_price
            # export_price_entity: sensor.your_export_price
      - type: grid
        cards:
          - type: custom:omnibattery-overview-card
            title: Energy overview
      - type: grid
        cards:
          - type: custom:omnibattery-battery-card
            # Select a battery in the visual editor.
            # battery: YOUR_HOME_ASSISTANT_DEVICE_ID
      - type: grid
        cards:
          - type: custom:omnibattery-status-card
            title: System status
      - type: grid
        cards:
          - type: custom:omnibattery-solar-independence-card
            # Supply a daily grid-to-home counter that excludes battery charging.
            # entities:
            #   dailyGridToHome: sensor.grid_to_home_energy_today
            # Enable only when these assumptions apply to your installation:
            # assume_no_grid_charging: true
            # assume_solar_only_export: true
      - type: grid
        cards:
          - type: custom:omnibattery-price-windows-card
            # Required for tariff data:
            # import_price_entity: sensor.your_import_price
      - type: grid
        cards:
          - type: custom:omnibattery-forecast-accuracy-card
            # Required separately persisted snapshot; see the README schema.
            # saved_forecast_entity: sensor.saved_energy_forecast
            forecast_metric: solar
      - type: grid
        cards:
          - type: custom:omnibattery-energy-today-card
            show_forecasts: true
